<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>
  <rect width="198" height="198" x="1" y="1" rx="43" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Glowing Aura -->
  <circle cx="100" cy="100" r="52" fill="url(#glowGrad)" filter="url(#glow)"/>

  <!-- Modern Geometric API Mesh / Hexagon Base -->
  <g transform="translate(100, 100)">
    <!-- Hexagon Frame -->
    <path d="M 0 -52 L 45 -26 L 45 26 L 0 52 L -45 26 L -45 -26 Z" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="3" 
          stroke-linejoin="round"
          opacity="0.4"/>
    
    <!-- Central Modern Bridge / T-Shape -->
    <path d="M -30 -24 L 30 -24 L 18 -6 L 8 -6 L 8 36 L -8 36 L -8 -6 L -18 -6 Z" 
          fill="url(#primaryGrad)"/>

    <!-- Orbital Connection Nodes -->
    <circle cx="0" cy="-52" r="4.5" fill="#38bdf8"/>
    <circle cx="45" cy="-26" r="4" fill="#6366f1"/>
    <circle cx="45" cy="26" r="4" fill="#818cf8"/>
    <circle cx="0" cy="52" r="4.5" fill="#a855f7"/>
    <circle cx="-45" cy="26" r="4" fill="#818cf8"/>
    <circle cx="-45" cy="-26" r="4" fill="#6366f1"/>

    <!-- Core Signal Indicator -->
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
</svg>
